name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: josematioli
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22C55E&color_dots=#161B22,#064E3B,#047857,#10B981,#22C55E
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22C55E&color_dots=#161B22,#064E3B,#047857,#10B981,#22C55E

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
